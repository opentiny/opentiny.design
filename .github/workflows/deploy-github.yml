name: Deploy home to github.io

on:
  push:
    branches: [dev,main]
    paths:
      - 'packages/common/**'
      - 'packages/home/**'

  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SUBMODULE_SSH_KEY }}
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Configure Git identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
      - name: Ensure submodules are up-to-date
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          git submodule status --recursive
      - name: Build genui-sdk homepage
        run: |
          pnpm build:genui-sdk
        env:
          VITE_GENUI_DOCS_BASE: https://opentiny.github.io/docs/genui-sdk
          VITE_GENUI_PLAYGROUND_HREF: https://opentiny.github.io/genui-sdk/playground/
      - name: Install deps
        run: |
          pnpm -F opentiny-design-common i --no-frozen-lockfile
          pnpm -F opentiny-design-home i --no-frozen-lockfile
      - name: Build common
        run: pnpm build:common
        env:
          VITE_CONTEXT: /opentiny.design/
          VITE_BASE: /opentiny.design/
      - name: Build home
        run: pnpm build
        env:
          VITE_CONTEXT: /opentiny.design/
          VITE_BASE: /opentiny.design/
          VITE_EnvName: github
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Copy files
        run: |
          cp dist/common/tinyui-design-common.iife.js dist/home
          cp dist/home/index.html dist/home/404.html
      - name: Setup Pages
        uses: actions/configure-pages@v2
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./dist/home
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
